[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chris-code"
version = "0.1.0"
description = "Free, model-independent autonomous coding harness."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chris-code = "chriscode.main:main"

[tool.setuptools.packages.find]
include = ["chriscode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
